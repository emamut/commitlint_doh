# Netlify Configuration for commitlint_doh
[build]
  command = "pnpm run build"
  publish = "dist"

# Handle backwards compatibility for URLs pointing to /src/
[[redirects]]
  from = "/src"
  to = "/"
  status = 301

[[redirects]]
  from = "/src/index.html"
  to = "/"
  status = 301

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
